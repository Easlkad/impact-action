name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck, yq and node are preinstalled on GitHub-hosted Ubuntu runners.
      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Script tests
        run: bash tests/scripts.test.sh

      - name: action.yml tests
        run: bash tests/action.test.sh

      - name: Comment script tests
        run: node --test tests/comment.test.js

  # Runs the action on this repository's own pull requests. impact is
  # installed from the main branch of the CLI, so this works before a CLI
  # version is tagged (it does require the CLI repository to be public).
  integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: impact
        uses: ./
        with:
          impact-version: main
          checkout: "false" # already checked out above, with the action itself
          comment: "false"

      - name: Check the outputs
        env:
          REPORT_MARKDOWN: ${{ steps.impact.outputs.report-markdown }}
          REPORT_JSON: ${{ steps.impact.outputs.report-json }}
          EXIT_CODE: ${{ steps.impact.outputs.exit-code }}
        run: |
          head -n 1 "$REPORT_MARKDOWN" | grep -qx '<!-- impact-report -->'
          jq -e '.schemaVersion == 1' "$REPORT_JSON"
          test "$EXIT_CODE" = 0
